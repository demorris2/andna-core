# cbindgen.toml — config for generating include/andna_core.h
# Wire up with: cbindgen --crate andna-ffi --config cbindgen.toml --output include/andna_core.h

language = "C"
header = """/* ================================================================
 * andna_core.h — AUTO-GENERATED by cbindgen, DO NOT HAND EDIT
 *
 * Regenerate: cargo run -p xtask -- gen-headers
 * Source: crates/ffi/src/lib.rs
 * ================================================================ */"""
include_guard = "ANDNA_CORE_H"
includes = ["andna_vnext_contracts.h"]
sys_includes = ["stdint.h", "stddef.h"]
after_includes = ""

[export]
include = ["AndnaErr"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
