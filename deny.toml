# cargo-deny workspace policy — ci/cargo-deny-policy-cleanup
# Destination: deny.toml at the WORKSPACE ROOT (replaces the existing file).
#
# Design:
# * Internal crates are private (`publish = false` on every workspace member — enforced by
#   the sweep in the cleanup instructions) and are exempted from license policing via
#   `licenses.private.ignore`. Only third-party licenses are policed.
# * Internal path/workspace deps legitimately carry no registry version;
#   `bans.allow-wildcard-paths` exempts them while still denying true wildcard versions
#   ("*") on external dependencies.
# * The windows-sys 0.59/0.61 duplicate comes from the bindgen/oqs-sys build toolchain and
#   is harmless; duplicates warn rather than fail.
# * NO oqs ban here: R1/mldsa44/ffi legitimately use oqs. D0/R2 isolation is enforced where
#   it belongs — as `cargo tree` gates in the andna-d0 and file-seal CI lanes.

[advisories]
yanked = "warn"

[licenses]
# Requires `publish = false` on all internal crates; see cleanup instructions.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
