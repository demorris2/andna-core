# cargo-deny policy — place at the REPO ROOT (cargo-deny runs workspace-wide).
# Reviewed for the whole andna-core workspace, not just D0.

[advisories]
version = 2
yanked = "deny"
# ignore = []   # add specific RUSTSEC IDs only with written justification

[bans]
multiple-versions = "warn"
wildcards = "deny"          # no "*" version requirements anywhere
# IMPORTANT: do NOT ban oqs / oqs-sys / liboqs here. R1 (crates/core, crates/ffi,
# crates/mldsa44) legitimately depends on liboqs via oqs = "0.10". A global ban would
# break the workspace. D0's isolation from oqs is enforced per-crate in CI with
#     cargo tree -p andna-d0 --locked   (must show no oqs/oqs-sys/liboqs)
# — see .github/workflows/andna-d0.yml.

[licenses]
version = 2
# Workspace-internal crates are license = "Proprietary" with publish = false. Skip them.
private = { ignore = true }
# External (transitive) dependency licenses. After the first `cargo deny check`, add any
# additional valid licenses it reports for real deps (sha3, zeroize, subtle, fips204,
# oqs, serde_json, hex, ...) rather than loosening the policy broadly.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
