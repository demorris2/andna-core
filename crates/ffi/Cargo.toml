[package]
name = "andna-ffi"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = ["oqs-backend"]
oqs-backend = ["andna-core/oqs-backend"]
stub = ["andna-core/stub"]

[dependencies]
andna-contracts = { workspace = true }
andna-core      = { workspace = true, default-features = false }
andna-codec     = { workspace = true }
oqs = "0.10"
sha3 = "0.10"

