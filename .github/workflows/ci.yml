name: andna-core CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.76.0"
          components: clippy, rustfmt

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            llvm-dev \
            libclang-dev \
            clang

      - name: Install liboqs (deterministic flags aligned to R1)
        run: |
          git clone --depth 1 --branch 0.10.1 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs
          mkdir build && cd build
          cmake -GNinja \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_DIST_BUILD=ON \
            ..
          ninja
          sudo ninja install
          sudo ldconfig

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warn on new issues, don’t hard-fail the whole sprint on non-critical warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          LD_LIBRARY_PATH: /usr/local/lib
        continue-on-error: true

      - name: Rust tests
        run: cargo test --all
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          LIBCLANG_PATH: /usr/lib/llvm-14/lib

      - name: Build release
        run: cargo build --release --all
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          LIBCLANG_PATH: /usr/lib/llvm-14/lib

  python-tests:
    runs-on: ubuntu-latest
    needs: rust-sanity
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.76.0"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            llvm-dev \
            libclang-dev \
            clang \
            python3 \
            python3-pip

      - name: Install liboqs
        run: |
          git clone --depth 1 --branch 0.10.1 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs
          mkdir build && cd build
          cmake -GNinja \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_DIST_BUILD=ON \
            ..
          ninja
          sudo ninja install
          sudo ldconfig

      - name: Build Rust FFI (release)
        run: cargo build --release -p andna-ffi
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          LIBCLANG_PATH: /usr/lib/llvm-14/lib

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pytest

      - name: Python tests (engine=python)
        run: |
          cd python
          VERIFY_ENGINE=python python -m pytest tests/ -v
        env:
          PYTHONDONTWRITEBYTECODE: 1

      - name: Python tests (engine=rust)
        run: |
          cd python
          VERIFY_ENGINE=rust ANDNA_LIB_PATH=../target/release/libandna_ffi.so \
            python -m pytest tests/ -v
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          PYTHONDONTWRITEBYTECODE: 1