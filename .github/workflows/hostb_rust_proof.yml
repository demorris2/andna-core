name: HostB Rust Proof (Docker Lane)

on:
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Confirm branch and audit crate
        run: |
          echo "github.ref_name=${{ github.ref_name }}"
          echo "git branch:"
          git rev-parse --abbrev-ref HEAD
          echo "git commit:"
          git rev-parse HEAD
          echo "---- ffi_cli/src/main.rs (first 5 lines) ----"
          sed -n '1,5p' ffi_cli/src/main.rs || true
          echo "---- audit crate ----"
          ls -la crates/audit || true
          test -f crates/audit/Cargo.toml && echo "OK: crates/audit/Cargo.toml exists" || (echo "MISSING: crates/audit/Cargo.toml" && exit 1)

      - name: Build pinned Docker image (builder stage, plain logs)
        run: |
          docker build --progress=plain --target builder -t andna-r1:builder .

      - name: Run Rust proof cycle inside Docker (Rust CLI only)
        run: |
          set -euo pipefail

          rm -rf hostb_out
          mkdir -p hostb_out

          docker run --rm \
            --entrypoint bash \
            -v "$PWD/hostb_out:/out" \
            andna-r1:builder \
            -lc '
              set -euo pipefail
              cd /build

              cargo build -p ffi-cli --release

              # Use the Rust-built binary (never /usr/local/bin/andna)
              BIN="./target/release/andna"
              if [ ! -x "$BIN" ]; then
                BIN="./target/release/ffi-cli"
              fi
              if [ ! -x "$BIN" ]; then
                echo "ERROR: Rust CLI binary not found."
                ls -la ./target/release || true
                exit 1
              fi

              echo "Using Rust CLI binary: $BIN"
              "$BIN" --help | head -n 40 || true

              # Sanity check: ensure this CLI supports gen/verify/tamper
              if ! "$BIN" gen --help >/dev/null 2>&1; then
                echo "ERROR: Built legacy CLI (missing gen). You are not on the promoted CLI branch."
                exit 1
              fi

              # Run from /out so artifacts persist to the runner
              cd /out
              rm -f sample_frame.bin tampered_frame.bin verification_log.json
              rm -rf evidence

              "$BIN" gen sample_frame.bin
              "$BIN" verify sample_frame.bin
              "$BIN" tamper sample_frame.bin tampered_frame.bin

              # Expected failure: tampered verify must reject
              set +e
              "$BIN" verify tampered_frame.bin
              RC=$?
              set -e
              if [ "$RC" -eq 0 ]; then
                echo "ERROR: tampered frame unexpectedly accepted"
                exit 1
             fi

              "$BIN" replay verification_log.json
              "$BIN" export evidence
            '

      - name: Show Host B artifacts
        run: |
          echo "==== verification_log.json ===="
          cat hostb_out/verification_log.json || true
          echo ""
          echo "==== evidence/manifest.json ===="
          cat hostb_out/evidence/manifest.json || true
          echo ""
          echo "==== evidence/evidence.json ===="
          cat hostb_out/evidence/evidence.json || true

      - name: Upload Host B artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostb-rust-proof
          path: hostb_out