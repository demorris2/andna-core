name: HostB Rust Proof (Docker Lane)

on:
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Confirm branch and audit crate
        run: |
          echo "github.ref_name=${{ github.ref_name }}"
          echo "git branch:"
          git rev-parse --abbrev-ref HEAD
          echo "git commit:"
          git rev-parse HEAD
          echo "---- ffi_cli/src/main.rs (first 5 lines) ----"
          sed -n '1,5p' ffi_cli/src/main.rs || true
          echo "---- audit crate ----"
          ls -la crates/audit || true
          test -f crates/audit/Cargo.toml && echo "OK: crates/audit/Cargo.toml exists" || (echo "MISSING: crates/audit/Cargo.toml" && exit 1)

      - name: Build pinned Docker image (builder stage, plain logs)
        run: |
          docker build --progress=plain --target builder -t andna-r1:builder .

      - name: Run Rust proof cycle inside Docker (Rust CLI only)
        run: |
          set -euo pipefail

          rm -rf hostb_out
          mkdir -p hostb_out

          docker run --rm \
            --entrypoint bash \
            -v "$PWD/hostb_out:/out" \
            andna-r1:builder \
            -lc '
              set -euo pipefail
              cd /build

              cargo build -p ffi-cli --release --features "oqs-backend fips-integrity-stub fips-kat-vectors-embedded" --features "oqs-backend fips-integrity-stub fips-kat-vectors-embedded" --features "oqs-backend fips-integrity-stub fips-kat-vectors-embedded" --features "oqs-backend fips-integrity-stub fips-kat-vectors-embedded"

              BIN="/build/target/release/andna"
              if [ ! -x "$BIN" ]; then
                BIN="/build/target/release/ffi-cli"
              fi
              if [ ! -x "$BIN" ]; then
                echo "ERROR: Rust CLI binary not found."
                ls -la /build/target/release || true
                exit 1
              fi

              echo "Using Rust CLI binary: $BIN"
              "$BIN" --help | head -n 40 || true

              if ! "$BIN" gen --help >/dev/null 2>&1; then
                echo "ERROR: Built legacy CLI. You are not on the promoted CLI branch."
                exit 1
              fi

              cd /out
              rm -f sample_frame.bin tampered_frame.bin verification_log.json andna_audit.jsonl
              rm -rf evidence evidence_tampered

              cp /build/demo/fixtures/sample_frame.bin sample_frame.bin

              "$BIN" verify sample_frame.bin
              "$BIN" tamper sample_frame.bin tampered_frame.bin

              set +e
              "$BIN" verify tampered_frame.bin
              RC=$?
              set -e
              if [ "$RC" -eq 0 ]; then
                echo "ERROR: tampered frame unexpectedly accepted"
                exit 1
              fi

              "$BIN" replay verification_log.json --frame sample_frame.bin
              
              "$BIN" export evidence

              # ==========================================
              # GATE 2 CI GATING & ACCEPTANCE HARNESS
              # ==========================================
              echo "Verifying Gate 2 artifacts..."
              if [ ! -f evidence/andna_audit.jsonl ] || [ ! -f evidence/audit_validate.json ]; then
                echo "ERROR: Gate 2 artifacts missing from export!"
                exit 1
              fi
              
              # Quote-safe check: just look for the word PASS
              if ! grep -q PASS evidence/audit_validate.json; then
                echo "ERROR: Gate 2 validator rejected the clean chain!"
                cat evidence/audit_validate.json
                exit 1
              fi
              echo "✓ Gate 1/T1 Baseline check passed."

              echo "Running Gate 2 T2 Tamper-Evidence Test..."
              cp andna_audit.jsonl tampered_audit.jsonl
              
              # Quote-safe replacement using regex dot to match the quotes
              sed -i s/decision.:1/decision.:0/ tampered_audit.jsonl

              mv andna_audit.jsonl good_audit.jsonl
              mv tampered_audit.jsonl andna_audit.jsonl

              "$BIN" export evidence_tampered || true

              if grep -q PASS evidence_tampered/audit_validate.json; then
                echo "ERROR: T2 FAILED! Validator blindly accepted a tampered audit log."
                exit 1
              else
                echo "✓ T2 PASSED: Validator correctly caught the tampered log."
              fi

              # ==========================================
              # GATE 2 T3: ORDER INVARIANCE & PERMUTATION
              # ==========================================
              echo "Running Gate 2 T3 Order Invariance Tests..."

              # T3.1: Record Reordering (Swap line 1 and 2)
              # Proves the validator rejects out-of-order sequences and broken prev_hash links
              tail -n 1 good_audit.jsonl > andna_audit.jsonl
              head -n 1 good_audit.jsonl >> andna_audit.jsonl
              "$BIN" export evidence_t3_swap || true
              if grep -q PASS evidence_t3_swap/audit_validate.json; then
                echo "ERROR: T3.1 FAILED! Validator blindly accepted a reordered chain."
                exit 1
              else
                echo "✓ T3.1 PASSED: Validator caught reordered records."
              fi

              # T3.2: Record Duplication
              # Proves the validator rejects duplicated sequence numbers and duplicated record_hashes
              cat good_audit.jsonl > andna_audit.jsonl
              tail -n 1 good_audit.jsonl >> andna_audit.jsonl
              "$BIN" export evidence_t3_dup || true
              if grep -q PASS evidence_t3_dup/audit_validate.json; then
                echo "ERROR: T3.2 FAILED! Validator blindly accepted duplicated records."
                exit 1
              else
                echo "✓ T3.2 PASSED: Validator caught duplicated records."
              fi

              # T3.3: Record Deletion (Missing genesis record)
              # Proves the validator rejects sequence gaps and enforces the 0-based genesis rule
              tail -n 1 good_audit.jsonl > andna_audit.jsonl
              "$BIN" export evidence_t3_del || true
              if grep -q PASS evidence_t3_del/audit_validate.json; then
                echo "ERROR: T3.3 FAILED! Validator blindly accepted a chain with deleted records."
                exit 1
              else
                echo "✓ T3.3 PASSED: Validator caught deleted records."
              fi

              # Restore the pristine chain for the final GitHub artifact upload
              mv good_audit.jsonl andna_audit.jsonl
            '

      - name: Show Host B artifacts
        run: |
          # Output the Gate 2 authoritative artifact
          echo "==== andna_audit.jsonl ===="
          cat hostb_out/andna_audit.jsonl || true
          echo ""
          echo "==== audit_validate.json ===="
          cat hostb_out/evidence/audit_validate.json || true
          echo ""
          echo "==== verification_log.json ===="
          cat hostb_out/verification_log.json || true
          echo ""
          echo "==== evidence/manifest.json ===="
          cat hostb_out/evidence/manifest.json || true

      - name: Upload Host B artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostb-rust-proof
          path: hostb_out