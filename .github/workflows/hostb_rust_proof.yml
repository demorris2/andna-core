name: HostB Rust Proof (Docker Lane)

on:
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pinned Docker image
        run: |
          docker build -t andna-r1:hostb .

      - name: Run Rust proof cycle inside Docker (clean)
        run: |
          set -euo pipefail

          # Make a clean workspace on the runner
          rm -rf hostb_out
          mkdir -p hostb_out

          # Run inside the container, writing artifacts into hostb_out
          docker run --rm \
            -v "$PWD/hostb_out:/out" \
            andna-r1:hostb \
            bash -lc '
              set -euo pipefail
              cd /app

              # Clean inside container
              rm -f /out/sample_frame.bin /out/tampered_frame.bin /out/verification_log.json
              rm -rf /out/evidence

              # Rust CLI location assumptions:
              # 1) If your Docker build produces a release binary, adjust path accordingly.
              # 2) We'll build it here deterministically in the pinned lane.
              cargo build -p ffi-cli --release

              BIN="./target/release/andna"

              $BIN gen /out/sample_frame.bin
              $BIN verify /out/sample_frame.bin
              $BIN tamper /out/sample_frame.bin /out/tampered_frame.bin
              $BIN verify /out/tampered_frame.bin
              $BIN replay /out/verification_log.json
              $BIN export /out/evidence
            '

      - name: Print Host B verification digest
        run: |
          echo "---- Host B evidence manifest ----"
          cat hostb_out/evidence/manifest.json
          echo ""
          echo "---- Host B evidence.json ----"
          cat hostb_out/evidence/evidence.json
          echo ""
          echo "---- Host B verification_log.json ----"
          cat hostb_out/verification_log.json

      - name: Upload HostB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostb-proof-artifacts
          path: hostb_out