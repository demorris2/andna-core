name: HostB Rust Proof (Docker Lane)

on:
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Confirm branch and audit crate
        run: |
          echo "github.ref_name=${{ github.ref_name }}"
          echo "git branch:"
          git rev-parse --abbrev-ref HEAD
          echo "git commit:"
          git rev-parse HEAD
          echo "---- ffi_cli/src/main.rs (first 5 lines) ----"
          sed -n '1,5p' ffi_cli/src/main.rs || true
          echo "---- audit crate ----"
          ls -la crates/audit || true
          test -f crates/audit/Cargo.toml && echo "OK: crates/audit/Cargo.toml exists" || (echo "MISSING: crates/audit/Cargo.toml" && exit 1)

      - name: Build pinned Docker image (plain logs)
        run: |
          docker build --progress=plain -t andna-r1:hostb .

      - name: Run Rust proof cycle inside Docker
        run: |
          set -euo pipefail

          rm -rf hostb_out
          mkdir -p hostb_out

          docker run --rm \
            --entrypoint bash \
            -v "$PWD/hostb_out:/out" \
            andna-r1:hostb \
            -lc '
              set -euo pipefail

              # Runtime image from Dockerfile starts in /workspace.
              # Rust binary is copied from builder into /usr/local/bin if available,
              # otherwise fall back to building inside /build if that path exists.
              if [ -x /usr/local/bin/andna ]; then
                BIN="/usr/local/bin/andna"
              elif [ -x /usr/local/bin/ffi-cli ]; then
                BIN="/usr/local/bin/ffi-cli"
              elif [ -x /build/target/release/andna ]; then
                BIN="/build/target/release/andna"
              elif [ -x /build/target/release/ffi-cli ]; then
                BIN="/build/target/release/ffi-cli"
              else
                echo "ERROR: CLI binary not found."
                echo "---- /usr/local/bin ----"
                ls -la /usr/local/bin || true
                echo "---- /build/target/release ----"
                ls -la /build/target/release || true
                exit 1
              fi

              echo "Using CLI binary: $BIN"
              "$BIN" version || true
              echo "---- CLI help ----"
              "$BIN" || true

              # Run from /out so logs + evidence persist to the runner
              cd /out
              rm -f sample_frame.bin tampered_frame.bin verification_log.json
              rm -rf evidence

              "$BIN" gen sample_frame.bin
              "$BIN" verify sample_frame.bin
              "$BIN" tamper sample_frame.bin tampered_frame.bin
              "$BIN" verify tampered_frame.bin
              "$BIN" replay verification_log.json
              "$BIN" export evidence
            '

      - name: Show Host B artifacts
        run: |
          echo "==== verification_log.json ===="
          cat hostb_out/verification_log.json || true
          echo ""
          echo "==== evidence/manifest.json ===="
          cat hostb_out/evidence/manifest.json || true
          echo ""
          echo "==== evidence/evidence.json ===="
          cat hostb_out/evidence/evidence.json || true

      - name: Upload Host B artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostb-rust-proof
          path: hostb_out