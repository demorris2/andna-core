name: HostB Rust Proof (Docker Lane)

on:
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pinned Docker image (builder stage for proof)
        run: |
          docker build --target builder -t andna-r1:builder .

      - name: Run Rust proof cycle inside Docker (builder image, clean)
        run: |
          set -euo pipefail

          rm -rf hostb_out
          mkdir -p hostb_out

          docker run --rm \
            --entrypoint bash \
            -v "$PWD/hostb_out:/out" \
            andna-r1:builder \
            -lc '
              set -euo pipefail

              cd /build
              cargo build -p ffi-cli --release

              # Binary name differs by branch:
              # - some branches produce /build/target/release/andna
              # - main currently produces /build/target/release/ffi-cli
              BIN="/build/target/release/andna"
              if [ ! -x "$BIN" ]; then
                BIN="/build/target/release/ffi-cli"
              fi
              if [ ! -x "$BIN" ]; then
                echo "ERROR: CLI binary not found. Contents of /build/target/release:"
                ls -l /build/target/release
                exit 1
              fi

              # Run from /out so logs + evidence persist to the runner
              cd /out
              rm -f sample_frame.bin tampered_frame.bin verification_log.json
              rm -rf evidence

              $BIN gen sample_frame.bin
              $BIN verify sample_frame.bin
              $BIN tamper sample_frame.bin tampered_frame.bin
              $BIN verify tampered_frame.bin
              $BIN replay verification_log.json
              $BIN export evidence
            '

      - name: Print Host B verification digest
        run: |
          echo "---- Host B evidence manifest ----"
          cat hostb_out/evidence/manifest.json
          echo ""
          echo "---- Host B evidence.json ----"
          cat hostb_out/evidence/evidence.json
          echo ""
          echo "---- Host B verification_log.json ----"
          cat hostb_out/verification_log.json

      - name: Upload HostB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostb-proof-artifacts
          path: hostb_out