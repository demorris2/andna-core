[project]
name = "andna"
version = "0.1.0"
description = "AN-DNA vNext Phase 1 — Python bindings for andna-core"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "Darrell Morris Jr."}]

[project.scripts]
andna = "andna.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
server = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "httpx>=0.24.0"]
all = ["pytest>=7.0", "fastapi>=0.100.0", "uvicorn>=0.23.0", "httpx>=0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
